version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  jobs:
    post_checkout:
      # Needed so setuptools_scm can determine the version from git tags.
      - git fetch --unshallow || true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        # `all` (server, postgres, imas-validator) so autodoc can import every
        # module for the API reference; `build-docs` for Sphinx itself.
        - all
        - build-docs

sphinx:
  builder: html
  # The CLI reference and Python API pages are generated from conf.py at build
  # time, so no pre_build / copy steps are needed.
  configuration: docs/conf.py
  fail_on_warning: false
